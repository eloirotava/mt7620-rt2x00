name: rt2x00-kmod

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/kmod.yml'
  workflow_dispatch:

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.2/targets/ramips/mt7620/openwrt-sdk-25.12.2-ramips-mt7620_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  kmod:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Cache do SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: sdk-tar-25.12.2-ramips-mt7620-v1

      - name: Baixa o SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: wget -q "$SDK_URL" -O sdk.tar.zst

      - name: SDK 25.12.2 ramips/mt7620
        run: |
          mkdir sdk && tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          cd sdk
          # o feeds.conf.default do SDK ja fixa o base no commit da release
          grep base feeds.conf.default
          ./scripts/feeds update base
          ./scripts/feeds install -p base mac80211

      - name: Patches rt2x00 do repo
        run: |
          # feed base com --root=package: package/kernel -> feeds/base/kernel
          M=sdk/feeds/base/kernel/mac80211
          P=$M/patches/rt2x00
          grep -E '^PKG_VERSION' $M/Makefile
          ls $P | tail -5
          for f in patches/*.patch; do [ -e "$f" ] && cp -v "$f" $P/; done
          true

      - name: Compila mac80211 (so rt2x00)
        run: |
          cd sdk
          make defconfig
          for p in kmod-rt2800-soc kmod-rt2800-lib kmod-rt2800-mmio kmod-rt2x00-lib kmod-rt2x00-mmio; do
            echo "CONFIG_PACKAGE_$p=m" >> .config
          done
          make defconfig
          make package/mac80211/compile -j$(nproc) V=s 2>&1 | tail -40

      - name: Junta os .ko
        run: |
          mkdir -p out
          # so a variante regular do mac80211 (a que o Archer usa)
          for m in rt2x00lib rt2x00mmio rt2800lib rt2800mmio rt2800soc; do
            f=$(find sdk/build_dir -path '*mac80211-regular*' -path '*.pkgdir*' -name "$m.ko" | head -1)
            [ -n "$f" ] || { echo "falta $m.ko"; exit 1; }
            cp -v "$f" out/
          done
          for k in out/*.ko; do modinfo $k | grep -E '^vermagic' ; done | sort -u
          ls -la out

      - name: Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: rt2x00-ko
          path: out/*.ko
