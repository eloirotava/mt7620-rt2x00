name: rt2x00-kmod

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.2/targets/ramips/mt7620/openwrt-sdk-25.12.2-ramips-mt7620_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  kmod:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: SDK 25.12.2 ramips/mt7620
        run: |
          wget -q "$SDK_URL" -O sdk.tar.zst
          mkdir sdk && tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          cd sdk
          # base fixo no commit da imagem 25.12.2 (r32802-f505120278):
          # o mac80211 carregado no roteador e o do backports desse commit
          sed -E 's#^src-git base .*#src-git base https://github.com/openwrt/openwrt.git^f505120278#' \
            feeds.conf.default > feeds.conf
          cat feeds.conf
          ./scripts/feeds update base
          ./scripts/feeds install -p base mac80211

      - name: Patches rt2x00 do repo
        run: |
          P=sdk/feeds/base/package/kernel/mac80211/patches/rt2x00
          grep -E '^PKG_VERSION' sdk/feeds/base/package/kernel/mac80211/Makefile
          ls $P | tail -5
          for f in patches/*.patch; do [ -e "$f" ] && cp -v "$f" $P/; done
          true

      - name: Compila mac80211 (so rt2x00)
        run: |
          cd sdk
          make defconfig
          for p in kmod-rt2800-soc kmod-rt2800-lib kmod-rt2800-mmio kmod-rt2x00-lib kmod-rt2x00-mmio; do
            echo "CONFIG_PACKAGE_$p=m" >> .config
          done
          make defconfig
          make package/mac80211/compile -j$(nproc) V=s 2>&1 | tail -40

      - name: Junta os .ko
        run: |
          mkdir -p out
          find sdk/build_dir -path '*backports*' -name 'rt2*.ko' -exec cp -v {} out/ \;
          for k in out/*.ko; do modinfo $k | grep -E '^vermagic' ; done | sort -u
          ls -la out

      - name: Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: rt2x00-ko
          path: out/*.ko
