name: probe-rt2860v2

# Sondagem: quanto falta para o rt2860v2 (MediaTek, kernel 3.10) compilar
# no 6.12 do OpenWrt 25.12.2.  So conta erros; nao gera nada utilizavel.

on:
  push:
    branches: [main]
    paths:
      - 'probe/**'
      - '.github/workflows/probe-rt2860v2.yml'
  workflow_dispatch:

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.2/targets/ramips/mt7620/openwrt-sdk-25.12.2-ramips-mt7620_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  RT2860V2_REPO: https://github.com/wuqiong/rt2860v2-for-openwrt-mt7620
  RT2860V2_COMMIT: master

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Cache do SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-25.12.2-ramips-mt7620-v1

      - name: SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "$SDK_URL" -O sdk.tar.zst
          mkdir sdk && tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Fonte rt2860v2
        run: |
          git clone -q "$RT2860V2_REPO" src
          git -C src checkout -q "$RT2860V2_COMMIT"
          git -C src log -1 --format='%h %cd %s'
          mkdir work
          cp -r src/rt2860v2 src/rt2860v2_ap work/
          # caminhos do Makefile in-tree -> fora da arvore
          sed -i 's#-Idrivers/net/wireless/rt2860v2#-I$(src)/../rt2860v2#g' work/rt2860v2_ap/Makefile

      - name: Compila (make -k)
        run: |
          export STAGING_DIR=$PWD/sdk/staging_dir
          LINUX=$(ls -d sdk/build_dir/target-*/linux-ramips_mt7620/linux-6.12.*)
          TC=$(ls -d sdk/staging_dir/toolchain-*/bin)
          echo "LINUX=$LINUX TC=$TC"
          make -k -C $LINUX M=$PWD/work/rt2860v2_ap ARCH=mips \
            CROSS_COMPILE=$PWD/$TC/mipsel-openwrt-linux-musl- \
            CONFIG_RT2860V2_AP=m CONFIG_SOC_MT7620=y CONFIG_RALINK_MT7620=y \
            CONFIG_INTERNAL_PA_EXTERNAL_LNA=y CONFIG_RT2860V2_AP_MBSS=y \
            CONFIG_RT2860V2_AP_80211N_DRAFT3=y \
            -j$(nproc) modules > build.log 2>&1 || true
          tail -5 build.log

      - name: Resumo
        run: |
          echo "== objetos compilados: $(grep -c ' CC \[M\]' build.log)"
          echo "== erros: $(grep -c 'error:' build.log)  avisos: $(grep -c 'warning:' build.log)"
          echo "== erros por arquivo"
          grep 'error:' build.log | sed -E 's#.*/work/##; s#:[0-9]+:[0-9]+:.*##' | sort | uniq -c | sort -rn | head -40
          echo "== tipos de erro"
          grep -oE 'error: .*' build.log | sed -E "s/'[^']*'/'X'/g" | sort | uniq -c | sort -rn | head -40
          echo "== identificadores implicitos/inexistentes"
          grep -oE "(implicit declaration of function|undeclared|has no member named|unknown type name) '[^']+'" build.log | sort | uniq -c | sort -rn | head -60

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-rt2860v2
          path: build.log
